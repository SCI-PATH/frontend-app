# SonarCloud — https://sonarcloud.io/project/overview?id=SCI-PATH_frontend-app
# Create the project in SonarCloud first, then adjust keys if yours differ.

sonar.projectKey=SCI-PATH_frontend-app
sonar.projectName=frontend-app
sonar.organization=sci-path

sonar.sources=src
sonar.tests=src

sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/coverage/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Embedded gaming copy is vendored; scan the standalone gaming-service repo instead.
sonar.coverage.exclusions=**/gaming-service/**

sonar.sourceEncoding=UTF-8
